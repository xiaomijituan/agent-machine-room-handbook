<svg width="1000" height="1000"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1000 1000"
  role="img"
  aria-label="三种起法各自的上级进程是谁：屏一前台直跑，进程的父亲是终端会话，窗口关掉时这个终端的前台进程组会收到挂起信号，很多程序就此结束，这一格是通用机制、本章未在实验机上抓现场；屏二用 nohup 加 disown 起的进程，父进程是 1 号，原来那个 shell 退出之后日志从 13 行涨到 21 行；屏三跑在 tmux 会话里的进程，宿主是 tmux 自己那个不属于任何终端的进程，伪终端被掐断之后会话仍在、日志从 6 行涨到 23 行。图底三条：关掉终端窗口打的是窗口不是进程的父亲；反过来 tmux kill-server 一下所有会话一起没了；断网的情况本章没有测"
  font-family="system-ui, 'Microsoft YaHei', 'PingFang SC', sans-serif"
>
  <defs>
    <marker id="arw-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#97a1b3" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1000" fill="#0d0f14" />

  <text x="500" y="52" text-anchor="middle" font-size="38" font-weight="bold" fill="#e8ecf3">进程认的是"父亲是谁"，不认"窗口开不开"</text>
  <text x="500" y="100" text-anchor="middle" font-size="32" fill="#97a1b3">同一台机器上三种起法，各自的上级进程是谁</text>

  <text x="179" y="140" text-anchor="middle" font-size="32" fill="#97a1b3">进程</text>
  <text x="539" y="140" text-anchor="middle" font-size="32" fill="#97a1b3">父亲 / 宿主</text>
  <text x="814" y="140" text-anchor="middle" font-size="32" fill="#97a1b3">掐掉进程挂着的终端之后</text>

  <rect x="40" y="152" width="920" height="210" rx="12" fill="#11141a" stroke="#242a36" stroke-width="3" />
  <text x="64" y="198" font-size="32" font-weight="bold" fill="#e8ecf3">屏一 · 前台直跑：父亲是终端会话本身</text>
  <rect x="64" y="224" width="230" height="78" rx="8" fill="#0d0f14" stroke="#242a36" stroke-width="2" />
  <text x="179" y="270" text-anchor="middle" font-size="32" fill="#e8ecf3">前台进程</text>
  <line x1="302" y1="268" x2="406" y2="268" stroke="#97a1b3" stroke-width="3" marker-end="url(#arw-grey)" />
  <text x="354" y="248" text-anchor="middle" font-size="32" fill="#97a1b3">父亲</text>
  <rect x="414" y="224" width="250" height="78" rx="8" fill="#0d0f14" stroke="#f87171" stroke-width="2" />
  <text x="539" y="270" text-anchor="middle" font-size="32" fill="#e8ecf3">终端会话</text>
  <text x="814" y="270" text-anchor="middle" font-size="32" font-weight="bold" fill="#f87171">会收到挂起信号</text>
  <text x="64" y="338" font-size="32" fill="#97a1b3">在另一台机器上量到了：日志停在第 4 行，进程变僵尸</text>

  <rect x="40" y="378" width="920" height="210" rx="12" fill="#11141a" stroke="#242a36" stroke-width="3" />
  <text x="64" y="424" font-size="32" font-weight="bold" fill="#e8ecf3">屏二 · nohup 加 disown 起的进程：父亲是 1 号</text>
  <rect x="64" y="450" width="230" height="78" rx="8" fill="#0d0f14" stroke="#242a36" stroke-width="2" />
  <text x="179" y="496" text-anchor="middle" font-size="32" fill="#e8ecf3">分离的进程</text>
  <line x1="302" y1="494" x2="406" y2="494" stroke="#97a1b3" stroke-width="3" marker-end="url(#arw-grey)" />
  <text x="354" y="474" text-anchor="middle" font-size="32" fill="#97a1b3">父亲</text>
  <rect x="414" y="450" width="250" height="78" rx="8" fill="#0d0f14" stroke="#4ade80" stroke-width="2" />
  <text x="539" y="496" text-anchor="middle" font-size="32" fill="#e8ecf3">1 号进程</text>
  <text x="814" y="496" text-anchor="middle" font-size="32" font-weight="bold" fill="#4ade80">日志继续涨</text>
  <text x="64" y="564" font-size="32" fill="#97a1b3">掐掉原来那个 shell 之后：日志 13 行涨到 21 行</text>

  <rect x="40" y="604" width="920" height="210" rx="12" fill="#11141a" stroke="#242a36" stroke-width="3" />
  <text x="64" y="650" font-size="32" font-weight="bold" fill="#e8ecf3">屏三 · tmux 会话里的进程：宿主不属于任何终端</text>
  <rect x="64" y="676" width="230" height="78" rx="8" fill="#0d0f14" stroke="#242a36" stroke-width="2" />
  <text x="179" y="722" text-anchor="middle" font-size="32" fill="#e8ecf3">会话里的进程</text>
  <line x1="302" y1="720" x2="406" y2="720" stroke="#97a1b3" stroke-width="3" marker-end="url(#arw-grey)" />
  <text x="354" y="700" text-anchor="middle" font-size="32" fill="#97a1b3">父亲</text>
  <rect x="414" y="676" width="250" height="78" rx="8" fill="#0d0f14" stroke="#4ade80" stroke-width="2" />
  <text x="539" y="722" text-anchor="middle" font-size="32" fill="#e8ecf3">tmux 的宿主进程</text>
  <text x="814" y="722" text-anchor="middle" font-size="32" font-weight="bold" fill="#4ade80">会话仍在</text>
  <text x="64" y="790" font-size="32" fill="#97a1b3">掐掉的是伪终端，不是宿主：日志 6 行涨到 23 行</text>

  <rect x="40" y="830" width="920" height="110" rx="12" fill="#11141a" stroke="#242a36" stroke-width="3" />
  <text x="500" y="876" text-anchor="middle" font-size="32" font-weight="bold" fill="#e8ecf3">关掉终端窗口：窗口没了，不等于进程的父亲没了</text>
  <text x="500" y="918" text-anchor="middle" font-size="32" fill="#97a1b3">反过来：tmux kill-server 一下，所有会话一起没了</text>

  <text x="500" y="976" text-anchor="middle" font-size="32" fill="#97a1b3">断网的情况本章没有测，图里也不写断网的结论</text>
</svg>
