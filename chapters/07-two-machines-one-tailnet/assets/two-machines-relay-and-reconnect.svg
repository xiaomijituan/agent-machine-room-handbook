<svg width="1000" height="1000"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1000 1000"
  role="img"
  aria-label="两台设备一条虚拟局域网的两组现象：第一组，跨设备十次探测十次通过，每一行末尾都写 via DERP(tok)，最后一行 direct connection not established，逐包延迟 339 到 485 毫秒、首包 2.629 秒；第二组，把一边的虚拟网关卡掉再拉起、等十几秒后测三次，一共做了三轮——第一轮关 20 秒等 12 秒，三发全通、最慢 1.353 秒；第二轮关 20 秒等 18 秒，两发直接超时、有一发 4.882 秒才通；第三轮关 25 秒等 14 秒，三发全通、最慢 3.367 秒；三轮里通的每一发都写 via DERP(tok)，没有一次自动变成直连。图底两条脚注：只有一轮出现超时，所以重连必然有几次不通没量到；打洞失败的原因没有证据，每条命令只留了输出末尾四行"
  font-family="system-ui, 'Microsoft YaHei', 'PingFang SC', sans-serif"
>
  <rect x="0" y="0" width="1000" height="1000" fill="#0d0f14" />

  <text x="500" y="58" text-anchor="middle" font-size="38" font-weight="bold" fill="#e8ecf3">连上了，不等于走的是你想的那条路</text>
  <text x="500" y="106" text-anchor="middle" font-size="32" fill="#97a1b3">下面两组现象都出自命令输出，不含原因</text>

  <rect x="40" y="132" width="920" height="348" rx="12" fill="none" stroke="#242a36" stroke-width="3" />
  <text x="72" y="182" font-size="32" font-weight="bold" fill="#e8ecf3">第一组 · 十次探测十次通过，次次写 via DERP(tok)</text>

  <rect x="72" y="224" width="180" height="72" rx="8" fill="#11141a" stroke="#242a36" stroke-width="2" />
  <text x="162" y="270" text-anchor="middle" font-size="32" fill="#e8ecf3">家里机器</text>
  <rect x="748" y="224" width="180" height="72" rx="8" fill="#11141a" stroke="#242a36" stroke-width="2" />
  <text x="838" y="270" text-anchor="middle" font-size="32" fill="#e8ecf3">随身设备</text>
  <rect x="405" y="224" width="190" height="72" rx="8" fill="#11141a" stroke="#f87171" stroke-width="2" />
  <text x="500" y="270" text-anchor="middle" font-size="32" font-weight="bold" fill="#e8ecf3">中继(tok)</text>

  <line x1="266" y1="260" x2="391" y2="260" stroke="#f87171" stroke-width="4" />
  <path d="M266 252 L266 268 L252 260 Z" fill="#f87171" />
  <path d="M391 252 L391 268 L405 260 Z" fill="#f87171" />
  <line x1="609" y1="260" x2="734" y2="260" stroke="#f87171" stroke-width="4" />
  <path d="M609 252 L609 268 L595 260 Z" fill="#f87171" />
  <path d="M734 252 L734 268 L748 260 Z" fill="#f87171" />

  <text x="72" y="332" font-size="32" fill="#e8ecf3">十行 pong，每一行末尾都是 via DERP(tok)</text>
  <text x="72" y="374" font-size="32" fill="#f87171">最后一行：direct connection not established</text>
  <text x="72" y="416" font-size="32" fill="#e8ecf3">逐包延迟 339 到 485 毫秒 · 首包 2.629 秒</text>
  <text x="72" y="458" font-size="32" fill="#97a1b3">tailscale status 里那条对端：active; relay &quot;tok&quot;</text>

  <rect x="40" y="504" width="920" height="356" rx="12" fill="none" stroke="#242a36" stroke-width="3" />
  <text x="72" y="554" font-size="32" font-weight="bold" fill="#e8ecf3">第二组 · 关掉网卡再拉起，等十几秒，测三次：一共三轮</text>

  <rect x="72" y="580" width="256" height="228" rx="8" fill="#11141a" stroke="#242a36" stroke-width="2" />
  <text x="200" y="622" text-anchor="middle" font-size="32" font-weight="bold" fill="#e8ecf3">第一轮</text>
  <text x="200" y="666" text-anchor="middle" font-size="32" fill="#97a1b3">关 20 秒</text>
  <text x="200" y="710" text-anchor="middle" font-size="32" fill="#97a1b3">拉起后等 12 秒</text>
  <text x="200" y="754" text-anchor="middle" font-size="32" fill="#4ade80">3 发全通</text>
  <text x="200" y="798" text-anchor="middle" font-size="32" fill="#e8ecf3">最慢 1.353 秒</text>

  <rect x="368" y="580" width="256" height="228" rx="8" fill="#11141a" stroke="#f87171" stroke-width="2" />
  <text x="496" y="622" text-anchor="middle" font-size="32" font-weight="bold" fill="#e8ecf3">第二轮</text>
  <text x="496" y="666" text-anchor="middle" font-size="32" fill="#97a1b3">关 20 秒</text>
  <text x="496" y="710" text-anchor="middle" font-size="32" fill="#97a1b3">拉起后等 18 秒</text>
  <text x="496" y="754" text-anchor="middle" font-size="32" fill="#f87171">第 1、3 发超时</text>
  <text x="496" y="798" text-anchor="middle" font-size="32" fill="#e8ecf3">第 2 发 4.882 秒</text>

  <rect x="664" y="580" width="256" height="228" rx="8" fill="#11141a" stroke="#242a36" stroke-width="2" />
  <text x="792" y="622" text-anchor="middle" font-size="32" font-weight="bold" fill="#e8ecf3">第三轮</text>
  <text x="792" y="666" text-anchor="middle" font-size="32" fill="#97a1b3">关 25 秒</text>
  <text x="792" y="710" text-anchor="middle" font-size="32" fill="#97a1b3">拉起后等 14 秒</text>
  <text x="792" y="754" text-anchor="middle" font-size="32" fill="#4ade80">3 发全通</text>
  <text x="792" y="798" text-anchor="middle" font-size="32" fill="#e8ecf3">最慢 3.367 秒</text>

  <text x="500" y="862" text-anchor="middle" font-size="32" font-weight="bold" fill="#f87171">三轮里通的每一发都写 via DERP(tok)，没有一次自动变成直连</text>

  <text x="500" y="924" text-anchor="middle" font-size="32" fill="#97a1b3">只有一轮出现超时，所以&quot;重连必然有几次不通&quot;没量到</text>
  <text x="500" y="968" text-anchor="middle" font-size="32" fill="#97a1b3">打洞为什么失败没有证据；每条命令只留了输出末尾四行</text>
</svg>
